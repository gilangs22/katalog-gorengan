<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bakul Gorengan</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body class="admin-body">
    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-bg-decor">
            <div class="login-blob blob-1"></div>
            <div class="login-blob blob-2"></div>
            <div class="login-blob blob-3"></div>
        </div>
        <div class="login-card">
            <i class="fas fa-basket-shopping login-logo"></i>
            <h2>Bakul Gorengan Admin</h2>
            <p>Silakan masuk untuk mengelola menu</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Masuk Ke Panel</button>
            </form>
            <p id="loginError" style="color: #e02d2d; font-size: 0.85rem; margin-top: 15px; display: none;">Username atau password salah!</p>
        </div>
    </div>

    <div class="admin-container" id="mainDashboard" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-basket-shopping"></i>
                <span>Gorengan Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="products"><i class="fas fa-box"></i> Produk</a>
                <a href="/" class="nav-item"><i class="fas fa-external-link-alt"></i> Lihat Web</a>
                <button onclick="logout()" class="nav-item btn-logout" style="width:100%; border:none; background:none; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Keluar Admin</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="formTitle">Tambah Produk Baru</h1>
            </header>

            <!-- Form Section -->
            <section class="form-card">
                <form id="productForm">
                    <div class="form-grid">
                        <!-- Informasi Dasar -->
                        <div class="form-group">
                            <label>Nama Produk</label>
                            <input type="text" id="productName" placeholder="Contoh: Donat misis + keju" required>
                        </div>
                        <div class="form-group">
                            <label>Kategori</label>
                            <select id="productCategory" required>
                                <option value="goreng">Goreng</option>
                                <option value="kukus">Kukus</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Harga (Rp)</label>
                            <input type="number" id="productPrice" placeholder="Contoh: 5500000" required>
                        </div>
                        <div class="form-group">
                            <label>Stok Unit</label>
                            <input type="number" id="productStock" value="1" required>
                        </div>

                        <!-- Detail menu gorengan -->
                        <div class="form-group">
                            <label>Prioritas / Urutan</label>
                            <input type="number" id="productBH" placeholder="Contoh: 1">
                        </div>
                        <div class="form-group">
                            <label>Isian / Varian</label>
                            <input type="text" id="productStorage" placeholder="Contoh: Coklat / Kacang ijo">
                        </div>
                        <div class="form-group">
                            <label>Tekstur</label>
                            <input type="text" id="productCamera" placeholder="Contoh: Empuk / Renyah">
                        </div>
                        <div class="form-group">
                            <label>Status Produksi</label>
                            <input type="text" id="productFaceId" placeholder="Contoh: Fresh harian">
                        </div>
                        <div class="form-group">
                            <label>Kemasan</label>
                            <input type="text" id="productScreen" placeholder="Contoh: Mika / Plastik">
                        </div>
                        <div class="form-group">
                            <label>Ukuran</label>
                            <input type="text" id="productBody" placeholder="Contoh: Reguler">
                        </div>
                        <div class="form-group">
                            <label>Minimal Order</label>
                            <input type="text" id="productIcloud" placeholder="Contoh: 1 pcs">
                        </div>
                        <div class="form-group">
                            <label>Estimasi Siap</label>
                            <input type="text" id="productImei" placeholder="Contoh: Hari ini">
                        </div>
                        <div class="form-group">
                            <label>Kelengkapan</label>
                            <input type="text" id="productCompleteness" placeholder="Contoh: Saus / topping sesuai menu">
                        </div>
                        <div class="form-group">
                            <label>Label Promo</label>
                            <input type="text" id="productReleaseYear" placeholder="Contoh: Best Seller">
                        </div>
                    </div>

                    <!-- Gambar & Deskripsi -->
                    <div class="form-group full-width">
                        <label>Gambar Produk</label>
                        <div class="image-upload-wrapper">
                            <input type="file" id="productImageFile" accept="image/*">
                            <input type="text" id="productImage" placeholder="Atau masukkan URL Gambar langsung">
                        </div>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>

                    <div class="form-group full-width">
                        <label>Catatan Produk</label>
                        <textarea id="productMinus" rows="3" placeholder="Contoh: Cocok untuk pesanan acara, harga grosir bisa chat admin."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancelEdit" class="btn btn-secondary" style="display:none;">Batal Edit</button>
                        <button type="submit" id="submitBtn" class="btn btn-primary">Simpan Produk</button>
                    </div>
                </form>
            </section>

            <!-- Table Section -->
            <section class="table-card">
                <div class="table-header">
                    <h2>Daftar Menu</h2>
                    <span id="productCount">0 menu</span>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Gambar</th>
                                <th>Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Data dimuat via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="/admin/admin.js"></script>
</body>
</html>
